<nav role="navigation" aria-label="Main navigation">
    <div class="container">
        <div class="nav-container">
            <!-- <a href="{{ .Site.BaseURL }}" class="logo" aria-label="{{ .Site.Title }} - Home">{{ .Site.Params.logo | default "GP" }}</a> -->
            <style>
                .site-title {
                  font-family: 'Orbitron', sans-serif;
                  font-weight: 600;
                  font-size: 1.5rem;
                  letter-spacing: 0.15em;
                  color: var(--text-primary);
                  text-decoration: none;
                  text-transform: uppercase;
                }
            </style>
            <header class="site-header">
                <a href="{{ .Site.BaseURL }}" aria-label="{{ .Site.Title }}" class="site-title">
                  RHYTHM + TECH
                </a>
            </header>
            <ul class="nav-links" id="nav-menu">
                {{ range .Site.Menus.main }}
                  <li><a href="{{ .URL }}" aria-current="false">{{ .Name }}</a></li>
                {{ end }}
              </ul>
            <div class="nav-actions">
                <div class="lang-switcher" role="group" aria-label="Language selection">
                    {{ range .Site.Languages }}
                    <a href="{{ if eq .Lang "zh" }}{{ $.Site.BaseURL }}{{ else }}{{ $.Site.BaseURL }}{{ .Lang }}/{{ end }}" 
                       class="lang-link {{ if eq .Lang $.Site.Language.Lang }}active{{ end }}" 
                       aria-label="Switch to {{ .LanguageName }}" 
                       {{ if eq .Lang $.Site.Language.Lang }}aria-current="true"{{ end }}>{{ .Lang | upper }}</a>
                    {{ end }}
                </div>
                <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="{{ i18n "dark_mode" }}" title="{{ i18n "dark_mode" }}">
                    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="mobile-menu-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle navigation menu">☰</button>
            </div>
        </div>
    </div>
</nav>
